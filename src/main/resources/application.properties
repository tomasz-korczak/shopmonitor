# DB user and password are not here: they are required in config/application.properties (see RequiredSettings)
spring.datasource.url=jdbc:h2:file:./data/smon
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# runs classpath:schema.sql (idempotent migrations) on every start
spring.datasource.initialization-mode=always
# never let Hibernate touch the schema (Boot 2.4 would otherwise default to create-drop for H2)
spring.jpa.hibernate.ddl-auto=none


spring.mail.properties.mail.smtp.auth=true
# port 465 = implicit TLS (SMTPS); the server certificate and host name are verified.
# For port 587 use mail.smtp.starttls.enable/starttls.required=true instead of ssl.enable.
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# JavaMail waits forever by default; a hanging SMTP server must fail the send, not the whole run (ms)
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=60000
#spring.mail.debug=true
#spring.mail.socket.debug=true


# recipients, mail account and footer (unsubscribe address, copyright) are set in config/application.properties
email.subject=shopmonitor report

#typical production logging: ERROR / INFO
logging.level.root=ERROR
logging.level.smon=INFO

spring.main.banner-mode=off

